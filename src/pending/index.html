<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pendingTitle">MirrorTab - Waiting</title>
  </head>
  <body class="kd-d-flex kd-items-center kd-py-5">
    <main class="kd-container-xs kd-empty kd-gap-3">
      <div class="kd-flex-center kd-pos-relative kd-mb-2">
        <span
          id="ring"
          class="kd-spinner kd-spinner--lg"
          style="--kd-spinner-size: 132px"
        ></span>
        <span
          id="countdown"
          class="kd-pos-absolute kd-font-mono kd-fs-xxxl kd-fw-bold kd-lh-none kd-text-accent"
          >-</span
        >
      </div>

      <h1 class="kd-m-0 kd-fs-xl kd-fw-bold" data-i18n="pendingHeading">
        Waiting to open
      </h1>
      <p
        id="note"
        class="kd-fs-xs kd-lh-xxl kd-text-secondary"
        data-i18n="pendingNote"
      >
        Staggered start is on, so this tab opens after a short delay.
      </p>

      <span class="kd-chip kd-chip--pill kd-font-mono kd-max-w-100">
        <span id="target-url" class="kd-text-ellipsis"></span>
      </span>

      <p class="kd-fs-xxxs kd-text-muted" data-i18n-html="pendingHint">
        Change this under
        <strong class="kd-text-secondary">Staggered tab opening</strong> in the
        MirrorTab settings.
      </p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
